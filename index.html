<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WYD 라틴어 미사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@1,400;1,500&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: one phone-width column (max 480px) with a bottom tab bar; "미사 중 모드" is a full-screen dark stage.
   Palette: WYD Seoul 2027 brand colors (Youth Blue, Cross Red, Glorious Yellow, Dark Black) on blue-biased neutrals. */
:root{
  --bg:#F6F7FA; --surface:#FFFFFF; --ink:#151821; --muted:#585E70; --line:#E1E4EB; --chip:#EDF0F4;
  --accent-fill:#0047BB; --accent-text:#0047BB; --blue-soft:#E7EEFA;
  --dim:#878D9C; --dim-solo:#B3B8C3;
  --red:#F32735; --yellow:#FBE126; --black:#000000;
  --scrim:rgba(10,12,18,.42);
  --f-ui:'Noto Sans KR', system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --f-latin:'EB Garamond', Georgia, 'Times New Roman', serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1017; --surface:#161A23; --ink:#ECEEF3; --muted:#A4AAB8; --line:#283040; --chip:#1F2430;
    --accent-fill:#2F6BE0; --accent-text:#8FB1FF; --blue-soft:#172647;
    --dim:#6E7587; --dim-solo:#474D5D; --scrim:rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1017; --surface:#161A23; --ink:#ECEEF3; --muted:#A4AAB8; --line:#283040; --chip:#1F2430;
  --accent-fill:#2F6BE0; --accent-text:#8FB1FF; --blue-soft:#172647;
  --dim:#6E7587; --dim-solo:#474D5D; --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-fill);outline-offset:2px}
.la{font-family:var(--f-latin);font-style:italic}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{flex-shrink:0}

.screen{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:20px 112px;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;color:var(--muted)}
.stripe{display:flex;gap:3px}
.stripe i{display:block;width:5px;height:16px;border-radius:2px}
h1.big{font-size:28px;font-weight:900;letter-spacing:-0.02em;margin:0;line-height:1.2;text-wrap:balance}
.lede{margin:0;color:var(--muted);font-size:14px}
.notice{font-size:13px;color:var(--muted);background:var(--chip);border-radius:10px;padding:10px 12px}

.search{display:flex;align-items:center;gap:10px;height:50px;padding-inline:14px;border-radius:12px;background:var(--chip);color:var(--muted)}
.search:focus-within{box-shadow:0 0 0 2px var(--accent-fill)}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:16px;color:var(--ink);outline:none}
.search input::placeholder{color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:36px;padding-inline:14px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}

.count{font-size:12px;color:var(--muted);padding-inline:2px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);text-align:left;cursor:pointer}
.item:hover{border-color:var(--accent-fill)}
.item .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.item .ko{font-size:16px;font-weight:700}
.item .la{font-size:16px;color:var(--muted)}
.item .pron{font-size:14px;color:var(--accent-text)}
.item .where{font-size:12px;color:var(--muted)}
.item[aria-disabled="true"]{cursor:default;opacity:.72}
.item[aria-disabled="true"]:hover{border-color:var(--line)}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--chip);color:var(--muted);white-space:nowrap}
.badge.ok{background:var(--blue-soft);color:var(--accent-text)}
.vrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);padding:12px 2px 0;border-top:1px solid var(--line)}
.vrow select{min-width:0;max-width:100%;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:13px;padding-inline:10px}
.empty{text-align:center;padding:40px 12px;display:flex;flex-direction:column;gap:6px;align-items:center}
.empty b{font-size:15px}
.empty span{font-size:13px;color:var(--muted)}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.tab{height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:none;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer}
.tab[aria-current="page"]{color:var(--accent-text);font-weight:700}

.live-cta{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;border:0;background:var(--ink);color:var(--bg);text-align:left;cursor:pointer;width:100%}
.live-cta .t{flex:1;display:flex;flex-direction:column;gap:2px}
.live-cta b{font-size:16px}
.live-cta span{font-size:13px;opacity:.8}
.legend{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent-text);display:inline-block}
.sec{border:1.5px solid var(--line);border-radius:14px;background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.sec h2{margin:0;font-size:17px;display:flex;align-items:baseline;gap:8px}
.sec h2 small{font-size:12px;font-weight:500;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{border:0;font-size:13px;padding:7px 11px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;min-height:34px}
.tag.say{background:var(--blue-soft);color:var(--accent-text);cursor:pointer;font-weight:500}
.tag.say::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.tag.listen{background:var(--chip);color:var(--muted)}

/* learn */
.learn{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:6px;padding:12px 16px 4px}
.topbar .t{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar h1{margin:0;font-size:18px;font-weight:700}
.topbar .sub{font-size:13px;color:var(--muted)}
.topbar .n{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;padding-right:4px}
.iconbtn{width:44px;height:44px;border-radius:22px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer}
.iconbtn.fill{background:var(--chip)}
.iconbtn:disabled,.btn:disabled{opacity:.38;cursor:default}
.learn > .notice{margin:4px 16px 0}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:26px;padding:18px 22px}
.ghost{color:var(--dim);display:flex;flex-direction:column;gap:2px}
.ghost .gk{font-size:19px;font-weight:700}
.ghost .gm{font-size:14px}
.cur{display:flex;flex-direction:column;gap:10px}
.cur .la{font-size:20px;color:var(--muted);line-height:1.35}
.who{font-size:12px;font-weight:700;color:var(--accent-text);letter-spacing:.02em}
.pron{display:flex;flex-wrap:wrap;gap:2px 2px;margin-left:-6px}
.word{border:0;background:transparent;border-radius:8px;padding:2px 6px;font-size:32px;font-weight:700;line-height:1.42;color:var(--dim);cursor:pointer;text-decoration:underline dotted;text-decoration-color:var(--line);text-decoration-thickness:2px;text-underline-offset:10px}
.word:hover{background:var(--chip)}
.solo .word{color:var(--dim-solo)}
.s.done{color:var(--accent-text)}
.s.now{text-decoration:underline solid;text-decoration-color:var(--red);text-decoration-thickness:3px;text-underline-offset:6px}
.cur .mean{font-size:16px}
.hint{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.learn{padding-bottom:calc(190px + env(safe-area-inset-bottom,0px));box-sizing:border-box}
.learn.short{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
.player{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding:12px max(16px, calc((100% - 448px) / 2)) calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.segs{display:flex;gap:4px}
.segs i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.segs i.past{background:var(--accent-fill);opacity:.4}
.segs i.on{background:var(--accent-fill)}
.controls{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mid{display:flex;align-items:center;gap:16px}
.play{width:64px;height:64px;border-radius:32px;border:0;background:var(--accent-fill);color:#FFFFFF;display:grid;place-items:center;cursor:pointer}
.pill{height:40px;padding-inline:13px;border-radius:20px;border:1.5px solid var(--line);background:var(--surface);font-size:13px;cursor:pointer;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill[aria-pressed="true"]{border-color:var(--accent-fill);background:var(--blue-soft);color:var(--accent-text);font-weight:700}
.row2{display:flex;align-items:center;justify-content:space-between;gap:8px}
.linkbtn{border:0;background:none;color:var(--accent-text);font-size:14px;padding:8px 0;cursor:pointer}

.scrim{position:fixed;inset:0;z-index:30;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;background:var(--surface);border-radius:22px 22px 0 0;padding:10px 22px calc(26px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.grab{align-self:center;width:40px;height:4px;border-radius:2px;background:var(--line)}
.sheet .head{display:flex;align-items:flex-start;gap:12px}
.sheet .head .t{flex:1;display:flex;flex-direction:column;gap:2px}
.sheet .wla{font-size:22px;color:var(--muted)}
.sheet .wko{font-size:34px;font-weight:900;color:var(--accent-text);line-height:1.25}
.sheet .wm{font-size:16px}
.tip{padding:12px 14px;border-radius:12px;background:var(--chip);font-size:14px}
.btns{display:flex;gap:10px}
.btn{flex:1;height:52px;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer}
.btn.pri{border:0;background:var(--accent-fill);color:#FFFFFF}
.btn.sec{border:1.5px solid var(--line);background:var(--surface);font-weight:500}

/* prayer detail */
.dlist{flex:1;display:flex;flex-direction:column;gap:6px;padding:12px 16px 20px}
.dline{display:flex;flex-direction:column;gap:4px;width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid transparent;background:transparent;text-align:left;cursor:pointer}
.dline:hover{background:var(--chip)}
.dline .dk{font-size:18px;font-weight:700;line-height:1.45;white-space:pre-line}
.cur .mean,.ghost .gm{white-space:pre-line}
.dline .dpr{font-size:17px;font-weight:500;color:var(--accent-text);line-height:1.45}
.dline.on{background:var(--blue-soft);border-color:var(--accent-fill)}
.dline.on .dk{color:var(--accent-text)}
.dwho{margin:0 16px;font-size:13px;font-weight:700;color:var(--accent-text)}
.dnote{margin:4px 16px 0;font-size:12px;color:var(--muted)}

/* practice */
.ctx{font-size:13px;color:var(--muted)}
.dots{display:flex;gap:4px;flex-wrap:wrap;max-width:140px;justify-content:flex-end}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent-fill)}
.chat{display:flex;flex-direction:column;gap:16px;padding:16px 20px;flex:1;justify-content:center}
.bub{display:flex;flex-direction:column;gap:6px;max-width:90%}
.bub .lab{font-size:12px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px}
.bub .box{background:var(--chip);border-radius:4px 16px 16px 16px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.bub .k{font-size:20px;font-weight:700;line-height:1.35}
.bub .la{font-size:17px;color:var(--muted)}
.bub .m{font-size:14px;color:var(--muted)}
.bub.me{align-self:flex-end}
.bub.me .lab{color:var(--accent-text);justify-content:flex-end}
.bub.me .box{background:var(--blue-soft);border:2px solid var(--accent-fill);border-radius:16px 4px 16px 16px;min-height:96px}
.bub.me .k{font-size:23px;color:var(--accent-text)}
.bar{height:16px;border-radius:6px;background:var(--accent-fill);opacity:.18}
.center{display:flex;justify-content:center}

/* live: a deliberate single dark look for use inside the church */
.live{position:fixed;inset:0;z-index:20;background:#0A0C11;color:#EEF0F4;overflow-y:auto;color-scheme:dark}
.live-in{max-width:480px;margin:0 auto;min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:16px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.live .bar1{display:flex;align-items:center;gap:6px}
.live .bar1 .t{flex:1;min-width:0;display:flex;flex-direction:column}
.live .eyebrow{font-size:12px;color:#A3A8B5}
.live h1{margin:0;font-size:17px;font-weight:700}
.live .iconbtn{color:#EEF0F4}
.szs{display:flex;gap:4px}
.szb{width:42px;height:42px;border-radius:10px;border:1.5px solid #3A404F;background:transparent;color:#EEF0F4;cursor:pointer;font-weight:700}
.szb[aria-pressed="true"]{background:#EEF0F4;color:#0A0C11;border-color:#EEF0F4}
.live .status{font-size:12px;color:#A3A8B5;display:flex;align-items:center;gap:6px}
.lcard{background:#191D26;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.lcard .lab{font-size:12px;color:#A3A8B5}
.lcard .k{font-size:18px;color:#DADDE5;font-weight:500}
.lcard .la{font-size:16px;color:#A3A8B5}
.resp{background:#00245F;border:2px solid #FBE126;border-radius:18px;padding:20px 18px;display:flex;flex-direction:column;gap:8px}
.resp .lab{font-size:13px;font-weight:700;color:#FBE126;display:flex;justify-content:space-between;align-items:center;gap:8px}
.resp .k{font-weight:900;line-height:1.3;color:#FFFFFF}
.resp .la{font-size:17px;color:#C9D6FF}
.resp .m{font-size:15px;color:#E3E9FF}
.sz0 .resp .k{font-size:26px} .sz1 .resp .k{font-size:32px} .sz2 .resp .k{font-size:40px}
.plines{display:flex;flex-direction:column;gap:14px}
.pl .k{font-weight:900;line-height:1.3;color:#FFFFFF}
.sz0 .pl .k{font-size:21px} .sz1 .pl .k{font-size:25px} .sz2 .pl .k{font-size:31px}
.pl .la{font-size:15px;color:#C9D6FF}
.listen{border:1.5px solid #FBE126;background:transparent;color:#FBE126;border-radius:16px;height:32px;padding-inline:10px;font-size:12px;font-weight:700;cursor:pointer}
.next{display:flex;flex-direction:column;gap:2px;padding-inline:4px;color:#A3A8B5}
.next .k{font-size:15px}
.lnav{display:flex;gap:10px;margin-top:auto}
.lnav button{height:64px;border-radius:16px;font-size:17px;cursor:pointer}
.lnav .prev{flex:1;border:1.5px solid #3A404F;background:#191D26;color:#EEF0F4;font-weight:500}
.lnav .nx{flex:2;border:0;background:#EEF0F4;color:#0A0C11;font-weight:900}
.lnav button:disabled{opacity:.4;cursor:default}
.live .note{font-size:12px;color:#A3A8B5;text-align:center}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion: no-preference){
  .scrim .sheet{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
}
</style>

<div id="view"></div>
<nav class="tabs" id="tabs" aria-label="주요 메뉴">

    <button class="tab" type="button" data-act="tab" data-to="home" id="tab-home">

</nav>

<script>
/* ---------- data ---------- */
/* 공식 한국어 기도문 자리.
   주교회의 사용 승인을 받은 뒤, 기도문 id마다 한 줄씩 순서대로 넣으세요. 줄 수는 라틴어 줄 수와 같아야 해요.
   예) pater: ['첫째 줄', '둘째 줄', ...]
   비어 있으면 아래 PRAYERS의 '뜻 풀이' 문장이 대신 보여요. */
const OFFICIAL = {
  signum: [],
  pater: [
    '하늘에 계신 우리 아버지,',
    '아버지의 이름이 거룩히 빛나시며',
    '아버지의 나라가 오시며',
    '아버지의 뜻이 하늘에서와 같이 땅에서도 이루어지소서!',
    '오늘 저희에게 일용할 양식을 주시고',
    '저희 죄를 용서하시고',
    '저희에게 잘못한 이를 저희가 용서하오니',
    '저희를 유혹에 빠지지 않게 하시고',
    '악에서 구하소서. 아멘.'
  ],
  kyrie: [], sanctus: [], agnus: [],
  ave: [
    '은총이 가득하신 마리아님, 기뻐하소서!\n주님께서 함께 계시니',
    '여인 중에 복되시며',
    '태중의 아들 예수님 또한 복되시나이다.',
    '천주의 성모 마리아님,',
    '저희 죄인을 위하여 빌어주소서.',
    '이제와 저희 죽을 때에\n아멘.'
  ],
  glpatri: [
    '영광이 성부와 성자와 성령께',
    '처음과 같이\n이제와 항상',
    '영원히.\n아멘.'
  ]
};
const koOf = (p, i) => (OFFICIAL[p.id] && OFFICIAL[p.id][i]) || p.lines[i][2];
const isOfficial = p => !!(OFFICIAL[p.id] && OFFICIAL[p.id].length === (p.lines || []).length);

const PUNCT = /[,.:;…!?()]/g;
const clean = w => w.replace(PUNCT,'').toLowerCase();
function wordsOf(la, ko){
  const L = la.split(/\s+/), K = ko.split(/\s+/);
  if (L.length !== K.length) return [{la, ko, mean:'', note:''}];
  return L.map((w,i) => ({la:w, ko:K[i], mean:GLOSS[clean(w)]||'', note:tipFor(w)}));
}
function tipFor(w){
  const s = clean(w);
  const t = [];
  if (/sc[eiy]/.test(s)) t.push('"sc"가 e·i 앞에 오면 "시" 소리예요.');
  else if (/xc[ei]/.test(s)) t.push('"xc"가 e·i 앞에 오면 "크셰"처럼 이어 읽어요.');
  else if (/c[eiy]|cae|coe/.test(s)) t.push('"c"가 e·i 앞에 오면 "ㅊ" 소리예요.');
  if (/gn/.test(s)) t.push('"gn"은 "뉴"처럼 읽어요.');
  if (/qu/.test(s)) t.push('"qu"는 "쿠"를 짧게, "크w" 소리예요.');
  if (/ae|oe/.test(s)) t.push('"ae·oe"는 "에"로 읽어요.');
  if (/[^stx]ti[aeiou]/.test(s)) t.push('"ti" 뒤에 모음이 오면 "치"로 읽어요.');
  if (/g[ei]/.test(s) && !/gn/.test(s)) t.push('"g"가 e·i 앞에 오면 "ㅈ" 소리예요.');
  if (/ch/.test(s)) t.push('"ch"는 "ㅋ" 소리예요.');
  else if (/h/.test(s)) t.push('"h"는 소리 내지 않아요.');
  if (/^i[aeou]/.test(s)) t.push('모음 앞 첫 "i"는 "이" 반모음이라 "예·유"처럼 붙여 읽어요.');
  if (/cc[ao]/.test(s)) t.push('"cc"는 받침 "ㄱ"을 넣어 "ㄱㅋ"으로 읽어요.');
  return t.length ? t.join(' ') : '쓰인 그대로 읽어요. 모음은 아·에·이·오·우로 또렷하게.';
}
const syls = ko => Array.from(ko.replace(PUNCT,''));
function toTTS(s){
  return s.replace(/ae/gi,'e').replace(/oe/gi,'e')
    .replace(/([^stx\s])ti([aeiou])/gi,'$1zi$2')
    .replace(/xc([ei])/gi,'csc$1')
    .replace(/ph/gi,'f').replace(/th/gi,'t')
    .replace(/j/gi,'i').replace(/y/gi,'i')
    .replace(/(^|[^c])h/gi,'$1')
    .replace(/…/g,'.').replace(/:/g,',');
}

/* ---------- speech ---------- */
/* Voice choice: Italian reads ecclesiastical Latin best; Spanish and Portuguese are fallbacks.
   Never let the browser fall back to the device default (often Korean): always pass an explicit voice,
   re-resolved from a fresh getVoices() list on every utterance. */
const TTS = { ok: typeof window.speechSynthesis !== 'undefined' && typeof window.SpeechSynthesisUtterance !== 'undefined', checked:false, uri:null };
try{ TTS.uri = localStorage.getItem('wyd-voice'); }catch(e){}
const LANG_RANK = l => /^it/i.test(l) ? 0 : /^es/i.test(l) ? 1 : /^pt/i.test(l) ? 2 : 9;
const LANG_NAME = l => /^it/i.test(l) ? '이탈리아어' : /^es/i.test(l) ? '스페인어' : /^pt/i.test(l) ? '포르투갈어' : l;
function candidates(){
  if (!TTS.ok) return [];
  return speechSynthesis.getVoices()
    .filter(v => LANG_RANK(v.lang) < 9)
    .sort((a, b) => (LANG_RANK(a.lang)*2 + (a.localService?0:1)) - (LANG_RANK(b.lang)*2 + (b.localService?0:1)));
}
function currentVoice(){
  const c = candidates();
  if (!c.length) return null;
  return c.find(v => v.voiceURI === TTS.uri) || c[0];
}
function onVoices(){
  if (!TTS.ok) return;
  if (speechSynthesis.getVoices().length) TTS.checked = true;
  const n = $('#voice-note'); if (n) n.outerHTML = voiceNote();
  const sel = $('#voice'); if (sel) sel.outerHTML = voiceSelect();
}
if (TTS.ok){ onVoices(); speechSynthesis.addEventListener('voiceschanged', onVoices); }
function whenVoices(cb){
  if (!TTS.ok || speechSynthesis.getVoices().length){ cb(); return; }
  let done = false;
  const go = () => { if (done) return; done = true; TTS.checked = true; cb(); };
  speechSynthesis.addEventListener('voiceschanged', go, {once:true});
  setTimeout(go, 1200);
}
const canSpeak = () => TTS.ok && !(TTS.checked && !currentVoice());
function voiceNote(){
  if (!TTS.ok) return '<div class="notice" id="voice-note">이 브라우저는 음성 재생을 지원하지 않아요. 글자가 칠해지는 속도에 맞춰 읽어 보세요.</div>';
  if (!TTS.checked) return '<span id="voice-note" hidden></span>';
  const v = currentVoice();
  if (!v) return '<div class="notice" id="voice-note">이 기기에 이탈리아어·스페인어 음성이 없어 소리를 낼 수 없어요. 글자만 칠해져요. 기기 설정에서 이탈리아어 음성을 추가해 주세요.</div>';
  if (!/^it/i.test(v.lang)) return `<div class="notice" id="voice-note">이탈리아어 음성이 없어 ${LANG_NAME(v.lang)} 음성으로 읽어요. 일부 발음이 다를 수 있어요.</div>`;
  return '<span id="voice-note" hidden></span>';
}
function voiceSelect(){
  const c = candidates(), cur = currentVoice();
  if (!c.length) return '<span id="voice" hidden></span>';
  return `<label class="vrow" id="voice"><span>읽어 줄 목소리</span>
    <select id="voice-sel" aria-label="읽어 줄 목소리">${c.map(v => `<option value="${v.voiceURI.replace(/"/g,'&quot;')}"${cur && v.voiceURI===cur.voiceURI?' selected':''}>${LANG_NAME(v.lang)} · ${v.name.replace(/</g,'&lt;')}</option>`).join('')}</select></label>`;
}
function speak(text, rate, on){
  on = on || {};
  if (!TTS.ok){ on.end && on.end(); return; }
  speechSynthesis.cancel();
  whenVoices(() => {
    const v = currentVoice();
    if (!v){ on.end && on.end(); return; }
    const tts = toTTS(text);
    const u = new SpeechSynthesisUtterance(tts);
    u.voice = v; u.lang = v.lang;
    u.rate = rate || 0.85;
    u.onboundary = e => { if (on.boundary && (!e.name || e.name === 'word')) on.boundary(e.charIndex, tts); };
    u.onend = () => on.end && on.end();
    u.onerror = () => on.end && on.end();
    setTimeout(() => { try{ speechSynthesis.resume(); }catch(e){} speechSynthesis.speak(u); }, 40);
  });
}
function stopSpeech(){ if (TTS.ok) speechSynthesis.cancel(); }

function go(route, opts){
  stopAll();
  Object.assign(S, opts || {}, {route});

}
function stopAll(){
  if (K){ K.alive = false; clearInterval(K.timer); K = null; }
  stopPA();

/* ---------- whole-prayer playback ---------- */
function stopPA(){
  if (PA){ PA.alive = false; clearTimeout(PA.t); PA = null; }
  markPA();
}
function markPA(){
  document.querySelectorAll('#dlist .dline').forEach((b, i) => b.classList.toggle('on', !!PA && S.pline === i));
  const b = $('#pabtn'); if (b) b.textContent = PA ? '일시정지' : '재생';
}
function playFrom(i){
  stopPA(); stopSpeech();
  const p = P(S.pid);
  const a = PA = { alive:true, t:null };
  const step = j => {
    if (!a.alive) return;
    if (j >= p.lines.length){ stopPA(); return; }
    S.pline = j; markPA();
    const el = document.querySelectorAll('#dlist .dline')[j];
    if (el) el.scrollIntoView({ block:'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    const next = () => { if (a.alive) a.t = setTimeout(() => step(j + 1), 450); };
    if (canSpeak()) speak(p.lines[j][0], S.rate, { end: next });
    else a.t = setTimeout(next, syls(p.lines[j][1]).length * 380);
  };
  step(i);
}
function render(){
  const tabbed = S.route === 'home' || S.route === 'mass';
  $('#tabs').hidden = !tabbed;
  $('#tab-home').toggleAttribute('aria-current', S.route === 'home'); if (S.route==='home') $('#tab-home').setAttribute('aria-current','page');
  $('#tab-mass').toggleAttribute('aria-current', S.route === 'mass'); if (S.route==='mass') $('#tab-mass').setAttribute('aria-current','page');
  view.innerHTML = VIEWS[S.route]();
  if (S.route === 'home') renderList();
  if (S.route === 'learn') paint();
  if (S.route === 'live') wakeOn(); else wakeOff();
  document.title = 'WYD 라틴어 미사';
}

    let k = 0;
    const pron = ws.map((w, i) => {
      const chars = Array.from(w.ko);
      const inner = chars.map(ch => /[,.:;…!?]/.test(ch) ? `<span class="pc">${ch}</span>` : `<span class="s" data-s="${k++}">${ch}</span>`).join('');
      return `<button type="button" class="word${S.sel===i?' sel':''}" data-act="word" data-i="${i}" aria-label="${w.ko.replace(PUNCT,'')}, ${w.la.replace(PUNCT,'')} 자세히 보기">${inner}</button>`;
    }).join('');
    return `<div class="learn${S.solo?' solo':''}">
      <div class="topbar">
        <button type="button" class="iconbtn" data-act="back" aria-label="뒤로">${I.back}</button>
        <div class="t"><h1>${p.ko}</h1><span class="sub"><span class="la">${p.la}</span> · ${p.where}</span></div>
        <span class="n">${S.line+1} / ${n}</span>
      </div>
      ${voiceNote()}
      <div class="stage">
        ${prev ? `<div class="ghost"><span class="gk">${prev[1]}</span><span class="gm">${koOf(p, S.line-1)}</span></div>` : `<div class="ghost" aria-hidden="true"><span class="gm">시작</span></div>`}
        <div class="cur">
          ${p.who ? `<div class="who">${p.who}</div>` : ''}
          <div class="la" lang="la">${L[0]}</div>
          <div class="pron" id="pron">${pron}</div>
          <div class="mean">${koOf(p, S.line)}</div>
          <div class="hint">${I.tap}<span id="hint">${S.solo ? '소리 없이 칠해져요. 칠해지는 글자를 따라 직접 읽어 보세요.' : '단어를 누르면 뜻과 발음 팁을 볼 수 있어요.'}</span></div>
        </div>
        ${next ? `<div class="ghost"><span class="gk">${next[1]}</span><span class="gm">${koOf(p, S.line+1)}</span></div>` : `<div class="ghost"><span class="gm">마지막 구절이에요</span></div>`}
      </div>
      <div class="player">
        <div class="segs" aria-hidden="true">${p.lines.map((_, i) => `<i class="${i<S.line?'past':i===S.line?'on':''}"></i>`).join('')}</div>
        <div class="controls">
          <button type="button" class="pill" data-act="rate" aria-label="재생 속도 바꾸기">${S.rate===0.7?'0.7배':S.rate===1?'1배':'0.85배'}</button>
          <div class="mid">
            <button type="button" class="iconbtn fill" data-act="line" data-d="-1" aria-label="이전 구절" ${S.line===0?'disabled':''}>${I.prev}</button>
            <button type="button" class="play" id="playbtn" data-act="play" aria-label="재생">${I.play}</button>
            <button type="button" class="iconbtn fill" data-act="line" data-d="1" aria-label="다음 구절" ${S.line===n-1?'disabled':''}>${I.next}</button>
          </div>
          <button type="button" class="pill" data-act="solo" aria-pressed="${S.solo}">내가 말하기</button>
        </div>
        <div class="row2">
          <button type="button" class="pill" data-act="repeat" aria-pressed="${S.repeat}">${S.repeat?'이 구절 반복':'이어서 듣기'}</button>
          <button type="button" class="linkbtn" data-act="practice" data-id="d2">미사 응답 연습하기 →</button>
        </div>
      </div>
    </div>`;
  },
  practice(){
    const d = DIALOGS[S.dlg];
    return `<div class="learn">
      <div class="topbar">
        <button type="button" class="iconbtn" data-act="back" aria-label="뒤로">${I.back}</button>
        <div class="t"><h1>응답 연습</h1><span class="sub">${d.ctx}</span></div>
        <span class="n">${S.dlg+1} / ${DIALOGS.length}</span>
      </div>
      ${voiceNote()}
      <div class="chat">
        <div class="bub">
          <div class="lab">${I.spk}<span>${d.pw}</span></div>
          <div class="box"><span class="la" lang="la">${d.p[0]}</span><span class="k">${d.p[1]}</span><span class="m">${d.p[2]}</span></div>
        </div>
        <div class="bub me">
          <div class="lab">내 차례 · 소리 내어 말해 보세요</div>
          <div class="box">${S.cover
            ? `<span class="m">외워서 말해 본 뒤 정답을 확인하세요</span><div class="bar" style="width:80%"></div><div class="bar" style="width:55%"></div>`
            : `<span class="la" lang="la">${d.r[0]}</span><span class="k">${d.r[1]}</span><span class="m">${d.r[2]}</span>`}</div>
        </div>
        <div class="center"><button type="button" class="pill" data-act="cover" aria-pressed="${S.cover}">${S.cover?'정답 보기':'가리고 해 보기'}</button></div>
      </div>
      <div class="player">
        <div class="btns">
          <button type="button" class="btn sec" data-act="say" data-w="p">${d.pw} 다시 듣기</button>
          <button type="button" class="btn sec" data-act="say" data-w="r">응답 듣기</button>
        </div>
        <div class="btns">
          <button type="button" class="btn sec" data-act="dlg" data-d="-1" ${S.dlg===0?'disabled':''}>이전</button>
          <button type="button" class="btn pri" data-act="dlg" data-d="1" style="flex:2">${S.dlg===DIALOGS.length-1?'연습 끝':'말해 봤어요, 다음'}</button>
        </div>
      </div>
    </div>`;
  },
  live(){
    const st = LIVE[S.live], nx = LIVE[S.live+1];
    let body = '';
    if (st.t === 'd'){
      const d = D(st.id);
      body = `<div class="lcard"><span class="lab">${d.pw}</span><span class="k">${d.p[1]}</span><span class="la" lang="la">${d.p[0]}</span></div>
      <div class="resp"><div class="lab"><span>내 응답</span><button type="button" class="listen" data-act="livesay">듣기</button></div>
        <span class="k">${d.r[1]}</span><span class="la" lang="la">${d.r[0]}</span><span class="m">${d.r[2]}</span></div>`;
    } else if (st.t === 'p'){
      const p = P(st.id);
      body = `<div class="resp"><div class="lab"><span>모두 함께 · ${p.ko}</span><button type="button" class="listen" data-act="learnfromlive" data-id="${p.id}">배우기</button></div>
        ${p.who ? `<span class="m">${p.who}</span>` : ''}
        <div class="plines">${p.lines.map(l => `<div class="pl"><div class="k">${l[1]}</div><div class="la" lang="la">${l[0]}</div></div>`).join('')}</div></div>`;
    } else {
      body = `<div class="resp"><div class="lab"><span>모두 함께 · ${st.title}</span></div><span class="m" style="font-size:17px">${st.text}</span></div>`;
    }
    return `<div class="live sz${S.size}" id="live">
      <div class="live-in">
        <div class="bar1">
          <button type="button" class="iconbtn" data-act="back" aria-label="미사 중 모드 닫기">${I.x}</button>
          <div class="t"><span class="eyebrow">지금 · ${S.live+1} / ${LIVE.length}</span><h1>${st.sec} · ${titleOf(st)}</h1></div>
          <div class="szs" role="group" aria-label="글자 크기">${[0,1,2].map(i => `<button type="button" class="szb" data-act="size" data-i="${i}" aria-pressed="${S.size===i}" aria-label="글자 ${['작게','보통','크게'][i]}" style="font-size:${12+i*4}px">가</button>`).join('')}</div>
        </div>
        <div class="status" id="wake">${I.sun}<span>소리는 꺼져 있어요 · 화면 꺼짐 방지를 켜는 중</span></div>
        ${body}
        <div class="next">${nx ? `<span style="font-size:12px">그다음</span><span class="k">${nx.sec} · ${titleOf(nx)}</span>` : `<span class="k">마침 예식이 끝났어요. 수고하셨어요.</span>`}</div>
        <div class="lnav">
          <button type="button" class="prev" data-act="livego" data-d="-1" ${S.live===0?'disabled':''}>이전</button>
          <button type="button" class="nx" data-act="livego" data-d="1" ${S.live===LIVE.length-1?'disabled':''}>다음</button>
        </div>
        <div class="note">화면을 옆으로 밀어도 넘어가요</div>
      </div>
    </div>`;
  }
};
function titleOf(it){
  if (it.t === 'd') return it.ctx || D(it.id).ctx;
  if (it.t === 'p') return P(it.id).ko;
  return it.title;
}
function tagHTML(it){
  if (it.t === 'l') return `<span class="tag listen">${it.title}</span>`;
  if (it.t === 'i') return `<span class="tag listen">${it.title} · 함께 노래</span>`;
  if (it.t === 'p'){ const p = P(it.id); return `<button type="button" class="tag say" data-act="open" data-id="${p.id}" data-from="mass">${p.ko} <span class="la">${p.la}</span></button>`; }
  const d = D(it.id);
  return `<button type="button" class="tag say" data-act="practice" data-id="${d.id}">${it.ctx || d.ctx}</button>`;
}
function renderList(){
  const q = S.q.trim().toLowerCase().replace(/\s/g,'');
  const norm = t => t.toLowerCase().replace(/\s/g,'');
  const items = PRAYERS.filter(p => {
    if (S.cat !== 'all' && p.cat !== S.cat) return false;
    if (!q) return true;
    const hay = norm([p.ko, p.la, p.pron||''].concat((p.lines||[]).flat()).join(' '));
    return hay.includes(q);
  });
  $('#count').textContent = items.length ? `${items.length}개 기도문` : '';
  $('#plist').innerHTML = items.length ? items.map(p => {
    const pron = p.soon ? p.pron : p.lines[0][1].split(' ').slice(0,3).join(' ') + '…';
    const badge = p.soon ? '<span class="badge">준비 중</span>' : '';
    const inner = `<span class="txt"><span class="top"><span class="ko">${p.ko}</span><span class="la">${p.la}</span></span><span class="pron">${pron}</span><span class="where">${p.where}</span></span>${badge}${p.soon?'':I.chev}`;
    return p.soon ? `<div class="item" aria-disabled="true">${inner}</div>` : `<button type="button" class="item" data-act="open" data-id="${p.id}" data-from="home">${inner}</button>`;
  }).join('') : `<div class="empty"><b>찾는 기도문이 없어요</b><span>다른 이름으로 찾아보거나, 미사 모드에서 순서대로 볼 수 있어요.</span><button type="button" class="linkbtn" data-act="tab" data-to="mass">미사 모드에서 보기</button></div>`;
}

/* ---------- karaoke ---------- */
function paint(){
  const pos = K ? Math.floor(K.pos) : 0;
  const playing = !!(K && K.playing);
  document.querySelectorAll('#pron .s').forEach(el => {
    const i = +el.dataset.s;
    el.classList.toggle('done', i < pos);
    el.classList.toggle('now', playing && i === pos - 1);
  });
  const b = $('#playbtn');
  if (b){ b.innerHTML = playing ? I.pause : I.play; b.setAttribute('aria-label', playing ? '일시정지' : '재생'); }
}
function startLine(){
  if (K){ K.alive = false; clearInterval(K.timer); }
  stopSpeech();
  const p = P(S.pid), L = p.lines[S.line];
  const ws = wordsOf(L[0], L[1]);
  const starts = []; let acc = 0;
  ws.forEach(w => { starts.push(acc); acc += syls(w.ko).length; });
  const k = K = { alive:true, playing:true, pos:0, total:acc, starts, cur:0, useB:false, timer:null };
  const silent = S.solo || !canSpeak();
  const sylMs = (silent ? 380 : 250) / (S.rate / 0.85);
  let last = performance.now();
  k.timer = setInterval(() => {
    if (!k.alive) return;
    const now = performance.now(), dt = now - last; last = now;
    let limit = k.total - (silent ? 0 : 0.6);
    if (k.useB) limit = k.starts[k.cur+1] !== undefined ? k.starts[k.cur+1] : k.total;
    k.pos = Math.min(k.pos + dt / sylMs, limit);
    paint();
    if (silent && k.pos >= k.total) lineDone(k);
  }, 50);
  if (!silent){
    speak(L[0], S.rate, {
      boundary(ci, text){
        if (!k.alive) return;
        const idx = text.slice(0, ci).trim().split(/\s+/).filter(Boolean).length;
        k.useB = true; k.cur = Math.min(idx, k.starts.length-1);
        k.pos = Math.max(k.pos, k.starts[k.cur]);
      },
      end(){ if (k.alive) lineDone(k); }
    });
  }
  paint();
}
function lineDone(k){
  if (!k.alive) return;
  k.pos = k.total; k.playing = false; clearInterval(k.timer); paint();
  const p = P(S.pid), last = S.line === p.lines.length - 1;
  setTimeout(() => {
    if (!k.alive || K !== k) return;
    if (S.repeat){ startLine(); return; }
    if (!last){ S.line++; S.sel = -1; view.innerHTML = VIEWS.learn(); startLine(); }
  }, 700);
}
function pause(){
  if (!K) return;
  K.alive = false; clearInterval(K.timer); stopSpeech();
  const keep = Math.floor(K.pos);
  K = { alive:false, playing:false, pos:keep };
  paint();
}

/* ---------- word sheet ---------- */
function openSheet(i){
  pause();
  const p = P(S.pid), L = p.lines[S.line], w = wordsOf(L[0], L[1])[i];
  S.sel = i;
  document.querySelectorAll('#pron .word').forEach((b, j) => b.classList.toggle('sel', j === i));
  $('#sheet').innerHTML = `<div class="scrim" data-act="closesheet">
    <div class="sheet" role="dialog" aria-modal="true" aria-label="단어 자세히" data-stop="1">
      <div class="grab" aria-hidden="true"></div>
      <div class="head"><div class="t">
        <span class="wla la" lang="la">${w.la.replace(PUNCT,'')}</span>
        <span class="wko">${w.ko.replace(PUNCT,'')}</span>
        <span class="wm">${w.mean || '뜻 준비 중'}</span>
      </div><button type="button" class="iconbtn fill" data-act="closesheet" aria-label="닫기">${I.x}</button></div>
      <div class="tip">${w.note}</div>
      <div class="btns">
        <button type="button" class="btn sec" data-act="sayword" data-r="0.55" data-w="${w.la.replace(PUNCT,'')}">천천히 듣기</button>
        <button type="button" class="btn pri" data-act="sayword" data-r="0.85" data-w="${w.la.replace(PUNCT,'')}">단어 듣기</button>
      </div>
    </div></div>`;
  const first = $('#sheet .btn.pri'); first && first.focus();
}
function closeSheet(){
  if (!$('#sheet').innerHTML) return;
  $('#sheet').innerHTML = '';
  S.sel = -1;
  document.querySelectorAll('#pron .word').forEach(b => b.classList.remove('sel'));
}

/* ---------- wake lock ---------- */
async function wakeOn(){
  const el = () => $('#wake span');
  try{
    if (!('wakeLock' in navigator)) throw 0;
    wake = await navigator.wakeLock.request('screen');
    if (el()) el().textContent = '소리는 꺼져 있어요 · 화면 꺼짐 방지 켜짐';
  }catch(e){ if (el()) el().textContent = '소리는 꺼져 있어요 · 이 기기에서는 화면 꺼짐 방지를 쓸 수 없어요'; }
}
function wakeOff(){ if (wake){ try{ wake.release(); }catch(e){} wake = null; } }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.route === 'live') wakeOn(); });

/* ---------- actions ---------- */
const ACT = {
  tab: el => go(el.dataset.to),
  cat: el => { S.cat = el.dataset.id; document.querySelectorAll('[data-act="cat"]').forEach(b => b.setAttribute('aria-pressed', b === el)); renderList(); },
  open: el => go('prayer', { pid:el.dataset.id, pline:0, pfrom:el.dataset.from || 'home' }),
  playall: () => { if (PA) { stopPA(); stopSpeech(); } else playFrom(0); },
  playfrom: el => playFrom(+el.dataset.i),
  learnit: () => go('learn', { line:0, sel:-1, from:'prayer' }),
  learnfromlive: el => go('learn', { pid:el.dataset.id, line:0, sel:-1, from:'live' }),
  back: () => {
    const f = S.from;
    if (S.route === 'practice' && S.practiceFrom) { go(S.practiceFrom); return; }
    if (S.route === 'prayer') { go(S.pfrom === 'mass' ? 'mass' : 'home'); return; }
    go(f === 'live' ? 'live' : f === 'prayer' ? 'prayer' : f === 'mass' ? 'mass' : 'home');
  },
  play: () => { if (K && K.playing) pause(); else { if (K && K.pos >= (K.total||1)) K = null; startLine(); } },
  line: el => { const p = P(S.pid); const n = Math.max(0, Math.min(p.lines.length-1, S.line + +el.dataset.d)); stopAll(); S.line = n; S.sel = -1; view.innerHTML = VIEWS.learn(); paint(); },
  rate: () => { S.rate = S.rate === 0.85 ? 0.7 : S.rate === 0.7 ? 1 : 0.85; const was = K && K.playing; stopAll(); view.innerHTML = VIEWS.learn(); paint(); if (was) startLine(); },
  solo: () => { S.solo = !S.solo; const was = K && K.playing; stopAll(); view.innerHTML = VIEWS.learn(); paint(); if (was) startLine(); },
  repeat: el => { S.repeat = !S.repeat; el.setAttribute('aria-pressed', S.repeat); el.textContent = S.repeat ? '이 구절 반복' : '이어서 듣기'; },
  word: el => openSheet(+el.dataset.i),
  closesheet: (el, e) => { if (e.target.closest('[data-stop]') && el.classList.contains('scrim')) return; closeSheet(); },
  sayword: el => speak(el.dataset.w, +el.dataset.r),
  practice: el => {
    const from = S.route === 'learn' ? 'learn' : S.route;
    const keep = { pid:S.pid, line:S.line };
    go('practice', Object.assign({ dlg: Math.max(0, DIALOGS.findIndex(d => d.id === el.dataset.id)), cover:false, practiceFrom: from }, keep));
    speak(DIALOGS[S.dlg].p[0], S.rate);
  },
  cover: () => { S.cover = !S.cover; view.innerHTML = VIEWS.practice(); },
  say: el => { const d = DIALOGS[S.dlg]; speak(el.dataset.w === 'p' ? d.p[0] : d.r[0], S.rate); },
  dlg: el => {
    const n = S.dlg + +el.dataset.d;
    if (n >= DIALOGS.length){ toast('응답 14개를 모두 연습했어요'); ACT.back(); return; }
    stopSpeech(); S.dlg = Math.max(0, n); view.innerHTML = VIEWS.practice(); speak(DIALOGS[S.dlg].p[0], S.rate);
  },
  live: el => go('live', { live:+el.dataset.i || 0, from:S.route }),
  livego: el => liveStep(+el.dataset.d),
  livesay: () => { const st = LIVE[S.live]; if (st.t === 'd') speak(D(st.id).r[0], S.rate); },
  size: el => { S.size = +el.dataset.i; store.set('wyd-size', S.size); const box = $('#live'); box.className = 'live sz' + S.size; document.querySelectorAll('.szb').forEach(b => b.setAttribute('aria-pressed', b === el)); }
};
function liveStep(d){
  const n = S.live + d;
  if (n < 0 || n >= LIVE.length) return;
  stopSpeech(); S.live = n;
  view.innerHTML = VIEWS.live();
  const box = $('#live'); if (box) box.scrollTop = 0;
  wakeOn();
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  if (el.classList.contains('scrim') && e.target !== el) return;
  ACT[el.dataset.act] && ACT[el.dataset.act](el, e);
});
document.addEventListener('input', e => { if (e.target.id === 'q'){ S.q = e.target.value; renderList(); } });
document.addEventListener('change', e => {
  if (e.target.id !== 'voice-sel') return;
  TTS.uri = e.target.value;
  try{ localStorage.setItem('wyd-voice', TTS.uri); }catch(err){}
  const n = $('#voice-note'); if (n) n.outerHTML = voiceNote();
  speak('Pater noster', 0.85);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ if ($('#sheet').innerHTML) closeSheet(); else if (S.route === 'live') ACT.back(); }
  if (S.route === 'live' && !e.target.closest('input')){
    if (e.key === 'ArrowRight') liveStep(1);
    if (e.key === 'ArrowLeft') liveStep(-1);
  }
});
let tx = null, ty = null;
document.addEventListener('touchstart', e => { if (S.route !== 'live') return; tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
document.addEventListener('touchend', e => {
  if (S.route !== 'live' || tx === null) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) liveStep(dx < 0 ? 1 : -1);
  tx = ty = null;
}, {passive:true});

render();
</script>
